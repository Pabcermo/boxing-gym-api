name: Deploy to Cloud Run

on:
  push:
    branches:
      - main          # Se activa solo cuando haces push a main

env:
  PROJECT_ID: trainingdemo-492712
  REGION: europe-west1
  SERVICE_NAME: boxing-gym-api
  IMAGE: gcr.io/trainingdemo-492712/boxing-gym-api

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write     # Necesario para Workload Identity

    steps:

      # 1. Descarga el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Autenticación con GCP sin claves JSON
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # 3. Configura gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Autoriza Docker para subir a GCR
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      # 5. Construye la imagen Docker
      - name: Build image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      # 6. Sube la imagen a Container Registry
      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # 7. Despliega en Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --add-cloudsql-instances trainingdemo-492712:europe-west1:free-trial-first-project \
            --set-secrets "DB_URL=DB_URL:latest" \
            --set-secrets "DB_USER=DB_USER:latest" \
            --set-secrets "DB_PASS=DB_PASS:latest" \
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      # 8. Muestra la URL final
      - name: Show URL
        run: |
          echo "✅ Desplegado en:"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)'